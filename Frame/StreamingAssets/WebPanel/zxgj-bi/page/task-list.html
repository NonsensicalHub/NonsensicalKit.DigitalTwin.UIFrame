<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="transparent" content="true">
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>任务清单</title>
		<!-- 引入Vue3 -->
		<script src="../js/vue.global.js"></script>
		<!-- 引入element-plus样式文件 -->
		<link rel="stylesheet" href="../css/element-plus.css" />
		<!-- 引入element-plus组件库 -->
		<script src="../js/element-plus.js"></script>
		<!-- 引入axios -->
		<script src="../js/axios.min.js"></script>
		<style>
			/* html引入外部字体 */
			@font-face {
				font-family: ABC;
				src: url('../font/SourceHanSansSC-Normal-2.otf');
				/* src: url('../font/ALiHanYiZhiNengHeiTi-2.ttf'); */
			}
			body,
			html,
			div,
			p,
			span {
				padding: 0;
				margin: 0;
				font-family: ABC;
			}
			#app {
				background-color: #061733;
				padding: 13px 13px;
			}
			.content {
				background-image: url('../img/bg.png');
				background-size: 100% 100%; /* 使背景图片覆盖整个区域 */
				background-position: center; /* 居中显示背景图片 */
				background-repeat: no-repeat; /* 不重复背景图片 */
				/* 高度为视口高度 */
				min-height: calc(100vh - 26px);
				width: calc(100wh - 26px);
				/* margin: 13px 13px; */
			}
			.grid-content {
				margin-top: 30px;
			}
			.model-start {
				margin-left: 48px;
			}
			.model-middle {
				margin-left: 24px;
				margin-right: 24px;
			}
			.model-end {
				margin-right: 48px;
			}
			.title-name {
				position: relative;
				z-index: 2;
				width: 76px;
				height: 24px;
				font-weight: bold;
				margin-left: 15px;
				font-size: 18px;
				line-height: 24px;
				background: linear-gradient(90deg, #ffffff 0%, #92b6ff 100%); /* 渐变颜色 */
				-webkit-background-clip: text; /* 仅对文本应用背景 */
				background-clip: text; /* 兼容性定义 */
				-webkit-text-fill-color: transparent; /* 使文本填充透明 */
			}
			.title-img {
				background-image: url('../img/title-bg.png');
				background-size: 100% 100%; /* 使背景图片覆盖整个区域 */
				background-position: center; /* 居中显示背景图片 */
				background-repeat: no-repeat; /* 不重复背景图片 */
				height: 20px; /* 高度为视口高度 */
				width: 100%;
				margin-top: -15px;
			}
			.btn-group {
				text-align: center;
				margin: 13px auto;
				display: flex;
				border-radius: 5px; /* 添加圆角 */
				border: 1px solid #1b829c;
			}
			.button {
				border: none;
				cursor: pointer;
				background-color: #0d2455;
				color: #3095f3;
			}
			.button.active {
				background-color: #409ef7; /* 激活状态的背景颜色 */
				color: #ffffff; /* 激活状态的文字颜色 */
				font-weight: bold;
			}
			.el-table--enable-row-hover .el-table__body tr:hover > td.el-table__cell {
				background-color: #409ef7 !important;
			}
			.div-model {
				height: calc((100vh - 150px));
				overflow-y: auto;
			}

			.div-model::-webkit-scrollbar {
				width: 6px;
			}

			.div-model::-webkit-scrollbar-track {
				/* background: rgba(54, 118, 220, 1); */
				border-radius: 2px;
			}

			.div-model::-webkit-scrollbar-thumb {
				background: #1d65a1;
				border-radius: 10px;
			}
			.headerCellClass {
				background-image: url('../img/table-bg.png');
				background-size: 100% 100%; /* 使背景图片覆盖整个区域 */
				background-position: center; /* 居中显示背景图片 */
				background-repeat: no-repeat; /* 不重复背景图片 */
				/* 背景透明 */
				background-color: #061733 !important;
				color: #ffffff;
				font-weight: bold;
			}
			/* 奇数行背景色 */
			.el-table__row.header-cell {
				background: #14315f;
				color: #ffffff;
			}
			/* 奇数行背景色 */
			.el-table__row.even-row {
				background: #14315f;
				color: #ffffff;
			}
			/* 偶数行背景色 */
			.el-table__row.odd-row {
				background: #0e2548;
				color: #ffffff;
			}
			.el-table td.el-table__cell,
			.el-table th.el-table__cell.is-leaf {
				border: none;
			}
			.el-table__inner-wrapper:before {
				background: none;
			}
			.dt-table {
				font-size: 13px;
				width: 100%;
				height: calc(100vh - 150px);
			}
			/* 媒体查询示例 */
			@media (max-width: 768px) {
				.model-start,
				.model-middle,
				.model-end {
					margin-left: 24px;
					margin-right: 24px;
				}
			}
		</style>
	</head>
	<body>
		<div id="app">
			<div class="content">
				<el-row :gutter="10">
					<el-col :xs="24" :sm="8">
						<div class="grid-content model-start">
							<!-- 标题 -->
							<div class="title-name">入库任务</div>
							<div class="title-img"></div>
							<!-- 按钮 -->
							<el-row>
								<!-- 按钮 -->
								<el-button-group class="btn-group">
									<el-button
										v-for="(button, index) in buttons"
										:key="index"
										size="default"
										:class="['button', { active: activeButton1 === index }]"
										@click="setActive1(index)">
										{{ button }}
									</el-button>
								</el-button-group>
							</el-row>
							<!-- 表格 -->
							<div class="div-model">
								<!-- stripe斑马条纹不起作用，我也不知道为啥 -->
								<el-table
									header-cell-class-name="headerCellClass"
									:row-class-name="tableRowClassName"
									size="default"
									class="dt-table"
									ref="table1"
									:data="userList1">
									<!-- 不要忘记末尾标签 </el-table-column>，否则会显示出错-->
									<el-table-column
										prop="no"
										label="订单号"
										width="110px"
										align="center"></el-table-column>
									<el-table-column
										width="160px"
										prop="createTime"
										label="创建时间"
										align="center"></el-table-column>
									<el-table-column
										prop="num"
										label="物料数量"
										align="center"></el-table-column>
									<el-table-column prop="state" label="订单状态" align="center">
										<template #default="scope">
											<span :style="{color: dataToColor(scope.row.state)}">
												{{ scope.row.state }}</span
											>
										</template>
									</el-table-column>
								</el-table>
							</div>
						</div>
					</el-col>
					<el-col :xs="24" :sm="8">
						<div class="grid-content model-middle">
							<!-- 标题 -->
							<div class="title-name">出库任务</div>
							<div class="title-img"></div>
							<!-- 按钮 -->
							<el-row>
								<!-- 按钮 -->
								<el-button-group class="btn-group">
									<el-button
										v-for="(button, index) in buttons"
										:key="index"
										size="default"
										:class="['button', { active: activeButton2 === index }]"
										@click="setActive2(index)">
										{{ button }}
									</el-button>
								</el-button-group>
							</el-row>
							<!-- 表格 -->
							<div class="div-model">
								<!-- stripe斑马条纹不起作用，我也不知道为啥 -->
								<el-table
									header-cell-class-name="headerCellClass"
									:row-class-name="tableRowClassName"
									size="default"
									ref="table2"
									:data="userList2"
									class="dt-table">
									<!-- 不要忘记末尾标签 </el-table-column>，否则会显示出错-->
									<el-table-column
										prop="no"
										label="订单号"
										width="110px"
										align="center"></el-table-column>
									<el-table-column
										prop="createTime"
										label="创建时间"
										width="160px"
										align="center"></el-table-column>
									<el-table-column
										prop="num"
										label="物料数量"
										align="center"></el-table-column>
									<el-table-column prop="state" label="订单状态" align="center">
										<template #default="scope">
											<span :style="{color: dataToColor(scope.row.state)}">
												{{ scope.row.state }}</span
											>
										</template>
									</el-table-column>
								</el-table>
							</div>
						</div>
					</el-col>
					<el-col :xs="24" :sm="8">
						<div class="grid-content model-end">
							<!-- 标题 -->
							<div class="title-name">盘点任务</div>
							<div class="title-img"></div>
							<!-- 按钮 -->
							<el-row>
								<!-- 按钮 -->
								<el-button-group class="btn-group">
									<el-button
										v-for="(button, index) in buttons"
										:key="index"
										size="default"
										:class="['button', { active: activeButton3 === index }]"
										@click="setActive3(index)">
										{{ button }}
									</el-button>
								</el-button-group>
							</el-row>
							<!-- 表格 -->
							<div class="div-model">
								<!-- stripe斑马条纹不起作用，我也不知道为啥 -->
								<el-table
									header-cell-class-name="headerCellClass"
									:row-class-name="tableRowClassName"
									size="default"
									ref="table3"
									:data="userList3"
									class="dt-table">
									<!-- 不要忘记末尾标签 </el-table-column>，否则会显示出错-->
									<el-table-column
										prop="no"
										label="订单号"
										width="110px"
										align="center"></el-table-column>
									<el-table-column
										prop="createTime"
										label="创建时间"
										width="160px"
										align="center"></el-table-column>
									<el-table-column
										prop="num"
										label="物料数量"
										align="center"></el-table-column>
									<el-table-column prop="state" label="订单状态" align="center">
										<template #default="scope">
											<span :style="{color: dataToColor(scope.row.state)}">
												{{ scope.row.state }}</span
											>
										</template>
									</el-table-column>
								</el-table>
							</div>
						</div>
					</el-col>
				</el-row>
			</div>
		</div>

		<script>
			//scroll方法不用对外，所以放在<script>里了
			const { createApp, ref, nextTick } = Vue
			let tableList1 = []
			let tableList2 = []
			let tableList3 = []

			createApp({
				setup() {
					const userList1 = ref([])
					const userList2 = ref([])
					const userList3 = ref([])
					const buttons = ref(['已完成', '拣货中', '待完成'])
					const activeButton1 = ref(0)
					const activeButton2 = ref(0)
					const activeButton3 = ref(0)
					const table1 = ref()
					const table2 = ref()
					const table3 = ref()
					return {
						table1,
						table2,
						table3,
						userList1,
						userList2,
						userList3,
						buttons,
						activeButton1,
						activeButton2,
						activeButton3,
					}
				},

				created() {
					this.showUserList()
					tableList1 = this.getRandom()
					tableList2 = this.getRandom()
					tableList3 = this.getRandom()
					this.userList1 = tableList1.filter(
						(item, index) => item.state == this.buttons[this.activeButton1]
					)
					this.userList2 = tableList2.filter(
						(item, index) => item.state == this.buttons[this.activeButton2]
					)
					this.userList3 = tableList3.filter(
						(item, index) => item.state == this.buttons[this.activeButton3]
					)
				},
				mounted() {
					// console.log(this.$refs.table1.$refs.bodyWrapper, '222222')
					// scroll(this.$refs.table1.bodyWrapper) //设置滚动
					setTimeout(() => {
						this.scrollUp()
					}, 2000)

					// scroll(this.table3.value.$refs.bodyWrapper) //设置滚动
				},

				methods: {
					scrollUp() {
						nextTick(() => {
							const demo1 =
								this.$refs.table1.$refs.bodyWrapper.getElementsByClassName(
									'el-scrollbar__wrap'
								)[0]
							const table1Scroll = ref(true)
							demo1.addEventListener('mouseover', () => {
								table1Scroll.value = false
							})
							demo1.addEventListener('mouseout', () => {
								table1Scroll.value = true
							})

							const demo2 =
								this.$refs.table2.$refs.bodyWrapper.getElementsByClassName(
									'el-scrollbar__wrap'
								)[0]
							const table2Scroll = ref(true)
							demo2.addEventListener('mouseover', () => {
								table2Scroll.value = false
							})
							demo2.addEventListener('mouseout', () => {
								table2Scroll.value = true
							})
							const demo3 =
								this.$refs.table3.$refs.bodyWrapper.getElementsByClassName(
									'el-scrollbar__wrap'
								)[0]
							const table3Scroll = ref(true)
							demo3.addEventListener('mouseover', () => {
								table3Scroll.value = false
							})
							demo3.addEventListener('mouseout', () => {
								table3Scroll.value = true
							})
							setInterval(() => {
								if (table1Scroll.value) {
									demo1.scrollTop += 3
									if (demo1.clientHeight + demo1.scrollTop + 1 >= demo1.scrollHeight) {
										// 到底了重新滚动
										demo1.scrollTop = 0
										table1Scroll.value = false
										setTimeout(() => {
											table1Scroll.value = true
										}, 2000)
									}
								}
								if (table2Scroll.value) {
									demo2.scrollTop += 3
									if (demo2.clientHeight + demo2.scrollTop + 1 >= demo2.scrollHeight) {
										// 到底了重新滚动
										demo2.scrollTop = 0
										table2Scroll.value = false
										setTimeout(() => {
											table2Scroll.value = true
										}, 2000)
									}
								}
								if (table3Scroll.value) {
									demo3.scrollTop += 3
									if (demo3.clientHeight + demo3.scrollTop + 1 >= demo3.scrollHeight) {
										// 到底了重新滚动
										demo3.scrollTop = 0
										table3Scroll.value = false
										setTimeout(() => {
											table3Scroll.value = true
										}, 2000)
									}
								}
							}, 100)
						})
					},

					// 随机数
					generateRandomNumber() {
						const min = 0
						const max = 99999999 // 8位数的最大值
						const randomNumber = Math.floor(Math.random() * (max - min + 1)) + min
						return 'LH' + randomNumber.toString().padStart(8, '0')
					},
					generateRandomTimeWithin24Hours() {
						const currentDate = new Date()
						const currentTime = currentDate.getTime()
						const randomTime = new Date(currentTime - Math.floor(Math.random() * 86400000)) // 24小时的毫秒数
						return randomTime.toISOString().slice(0, 19).replace('T', ' ')
					},
					generateRandomInteger() {
						const min = 100
						const max = 5000
						return Math.floor(Math.random() * (max - min + 1)) + min
					},
					getRandom() {
						let data = []
						for (let index = 0; index < 100; index++) {
							data.push({
								no: this.generateRandomNumber(),
								createTime: this.generateRandomTimeWithin24Hours(),
								num: this.generateRandomInteger(),
								state: ['已完成', '拣货中', '待完成'][Math.floor(Math.random() * 3)],
							})
						}
						return data
					},
					// 颜色转化
					dataToColor(data) {
						if (data === '已完成') {
							return '#2CD9B2'
						} else if (data === '拣货中') {
							return '#D35CC8'
						} else if (data === '待完成') {
							return '#FFDB47'
						}
					},
					setActive1(index) {
						this.activeButton1 = index // 设置激活状态
						this.userList1 = tableList1.filter(
							(item, index) => item.state == this.buttons[this.activeButton1]
						)
					},
					setActive2(index) {
						this.activeButton2 = index // 设置激活状态
						this.userList2 = tableList2.filter(
							(item, index) => item.state == this.buttons[this.activeButton2]
						)
					},
					setActive3(index) {
						this.activeButton3 = index // 设置激活状态
						this.userList3 = tableList3.filter(
							(item, index) => item.state == this.buttons[this.activeButton3]
						)
					},
					tableRowClassName({ row, rowIndex }) {
						if (rowIndex % 2 == 0) {
							return 'even-row'
						} else {
							return 'odd-row'
						}
					},
					showUserList() {
						//使用axios自定义配置，访问指定地址
						const request = axios.create({
							baseURL: 'http://localhost:9000',
						})

						request
							.get('/user/allUsers')
							.then((response) => {
								console.log('数据获取成功', response.data)
								this.userList = response.data
							})
							.catch((error) => {
								console.log('数据获取失败', error)
							})
					},
				},
				// 全部引入ElementPlus
			})
				.use(ElementPlus)
				.mount('#app')
		</script>
	</body>
</html>
